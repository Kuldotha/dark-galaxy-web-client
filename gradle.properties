org.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=1g
# The Kotlin/Wasm backend needs noticeably more heap than the JVM/Android one — the default
# daemon size OOMs partway through :compileProductionExecutableKotlinWasmJs.
kotlin.daemon.jvmargs=-Xmx4g

org.gradle.caching=true
org.gradle.parallel=true
kotlin.code.style=official
